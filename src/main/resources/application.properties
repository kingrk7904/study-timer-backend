# ── Server ──────────────────────────────────────────────────────────
# Reads PORT env-var (set automatically by Azure App Service / Docker).
# Falls back to 8080 for local development.
server.port=${PORT:8080}
server.address=0.0.0.0

# ── H2 In-memory datasource ─────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:studydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Disable H2 web console in production (potential security risk)
spring.h2.console.enabled=false

# ── Actuator ────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# ── Logging ─────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.example.studytimer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
